name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.10', '1']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - name: Prepare manifest
        shell: bash
        run: |
          if [ "${{ matrix.julia-version }}" = "1.10" ]; then
            # Committed Manifest targets the latest stable Julia; 1.10 resolves its own
            rm Manifest.toml
          fi
          julia --project=. -e "using Pkg; Pkg.Registry.add(); Pkg.resolve()"
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
